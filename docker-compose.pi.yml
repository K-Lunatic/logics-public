services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ink
      MYSQL_USER: ink
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
        NEXT_PUBLIC_GOOGLE_DRIVE_API_KEY: ${NEXT_PUBLIC_GOOGLE_DRIVE_API_KEY:-}
    restart: unless-stopped
    env_file:
      - ${INK_ENV_FILE:-.env.pi}
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ink
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ink
      MYSQL_POOL_SIZE: 8
      MYSQL_SSL: "false"
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"

  migrate:
    profiles: ["migration"]
    build:
      context: .
      target: builder
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
        NEXT_PUBLIC_GOOGLE_DRIVE_API_KEY: ${NEXT_PUBLIC_GOOGLE_DRIVE_API_KEY:-}
    env_file:
      - ${INK_ENV_FILE:-.env.pi}
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ink
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ink
      MYSQL_POOL_SIZE: 2
      MYSQL_SSL: "false"
      MIGRATION_STATE_FILE: /app/.migration/firestore-to-mysql.json
    volumes:
      - ./.migration:/app/.migration
    command: pnpm db:migrate:firestore
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
